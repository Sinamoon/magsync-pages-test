name: Publish magazine images
on: workflow_dispatch

concurrency:
  group: magsync-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.2.0
      - name: Prepare and validate the magazine
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/magazine.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
      - run: tar -xf artifact.tar
      - name: Deploy the magazine
        id: publish
        uses: actions/deploy-pages@v4
      - name: Verify published image
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl -fsS --max-time 15 "${PAGE_URL%/}/atlas.png?run=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/published.png" &&
               cmp -s atlas.png "$RUNNER_TEMP/published.png"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub Pages is not serving the deployed atlas."
          exit 1

